name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for attaching APKs to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fetch fonts (Playfair Display + DM Sans)
        run: |
          mkdir -p app/src/main/assets/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          f=app/src/main/assets/fonts
          [ -s $f/PlayfairDisplay.ttf ] || curl -fsSL "$base/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf" -o $f/PlayfairDisplay.ttf || rm -f $f/PlayfairDisplay.ttf
          [ -s $f/DMSans.ttf ] || curl -fsSL "$base/dmsans/DMSans%5Bopsz,wght%5D.ttf" -o $f/DMSans.ttf || rm -f $f/DMSans.ttf
          ls -la $f || true

      - name: Build debug + release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: life-os-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: life-os-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Attach APKs to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
